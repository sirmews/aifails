name: CI/CD & Nightly Database Backup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly D1 backup at 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  typecheck:
    name: Typecheck & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build Static Tailwind CSS
        run: bun run build:css

      - name: Run TypeScript Typecheck
        run: bun run typecheck

  deploy:
    name: Deploy to Cloudflare Workers
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Static Tailwind CSS
        run: bun run build:css
      - name: Apply Remote D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate:remote

      - name: Deploy Worker to Cloudflare Edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

  backup:
    name: Nightly D1 Database Backup
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Export Remote D1 Database SQL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups
          bunx wrangler d1 export DB --remote --output backups/d1-backup-$(date +'%Y-%m-%d').sql

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-database-backups
          path: backups/*.sql
          retention-days: 30
